name: Spec Stage (caller)

on:
  issues:
    types: [labeled]

jobs:
  spec:
    if: github.event.label.name == 'state:ready-for-spec'
    permissions:
      contents: write
      issues: write
      pull-requests: write
      copilot-requests: write
    uses: Ajay-vishal3/agents-repo/.github/workflows/spec-agent.yml@main
    with:
      issue-number: ${{ github.event.issue.number }}
      issue-title: ${{ github.event.issue.title }}
      agents-repo: Ajay-vishal3/agents-repo
      agents-ref: main
